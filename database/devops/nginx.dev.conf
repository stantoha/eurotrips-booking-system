# nginx/nginx.dev.conf — DEV reverse proxy
# Маршрутизація:
#   http://localhost/api/*  →  backend:3000
#   http://localhost/docs   →  backend:3000  (Swagger)
#   http://localhost/*      →  frontend:5173 (Vite + HMR)

events {
  worker_connections 256;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  # Upstream-и
  upstream backend  { server backend:3000;  }
  upstream frontend { server frontend:5173; }

  server {
    listen 80;
    server_name localhost;

    # ── REST API ──────────────────────────────────────────
    location /api/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Swagger UI ────────────────────────────────────────
    location /docs {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # ── Health check ──────────────────────────────────────
    location /health {
      proxy_pass http://backend/api/v1/health;
      access_log off;
    }

    # ── Vite HMR WebSocket ────────────────────────────────
    location /__vite_ping {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }

    # ── Frontend (React SPA + Vite dev server) ────────────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_read_timeout 86400s;  # потрібно для HMR WS
    }
  }
}
