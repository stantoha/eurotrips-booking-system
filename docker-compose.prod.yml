# =============================================================
#  docker-compose.prod.yml — PRODUCTION / STAGING
#  Відмінності від docker-compose.yml (dev):
#    - Images з GHCR (не локальний build)
#    - Немає відкритих портів для postgres/redis (тільки internal)
#    - Nginx з SSL
#    - resource limits
#    - restart: always
# =============================================================

version: "3.9"

services:

  # ── PostgreSQL 16 (internal only) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eurotrips_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    # Немає ports — доступний тільки через internal network
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ── Redis 7 (internal only) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eurotrips_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # ── Backend (GHCR image) ─────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_REPO}/backend:${IMAGE_TAG:-latest}
    container_name: eurotrips_backend
    restart: always
    environment:
      NODE_ENV:                production
      PORT:                    3000
      DATABASE_URL:            postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:               redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:              ${JWT_SECRET}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN:          ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN:  ${JWT_REFRESH_EXPIRES_IN:-30d}
      SENDGRID_API_KEY:        ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL:     ${SENDGRID_FROM_EMAIL:-noreply@eurotrips.ua}
      SENDGRID_FROM_NAME:      ${SENDGRID_FROM_NAME:-Eurotrips}
      TELEGRAM_BOT_TOKEN:      ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_NOTIFY_CHAT_ID: ${TELEGRAM_NOTIFY_CHAT_ID}
      VIBER_AUTH_TOKEN:        ${VIBER_AUTH_TOKEN:-}
      VIBER_WEBHOOK_URL:       ${VIBER_WEBHOOK_URL:-}
      FRONTEND_URL:            ${FRONTEND_URL:-https://booking.eurotrips.ua}
      API_URL:                 ${API_URL:-https://api.eurotrips.ua}
      CORS_ORIGIN:             ${CORS_ORIGIN:-https://booking.eurotrips.ua,https://eurotrips.ua}
      RATE_LIMIT_MAX:          ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS:    ${RATE_LIMIT_WINDOW_MS:-60000}
      QUEUE_CONCURRENCY:       ${QUEUE_CONCURRENCY:-5}
      QUEUE_MAX_RETRIES:       ${QUEUE_MAX_RETRIES:-3}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    # expose — лише для internal + external (через nginx)
    expose:
      - "3000"
    networks:
      - internal
      - external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend (GHCR image) ────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPO}/frontend:${IMAGE_TAG:-latest}
    container_name: eurotrips_frontend
    restart: always
    expose:
      - "80"
    networks:
      - external
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Nginx (SSL termination + reverse proxy) ──────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: eurotrips_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - external
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Networks ──────────────────────────────────────────────────
networks:
  internal:
    # postgres і redis — недоступні зовні
    internal: true
    name: eurotrips_internal
  external:
    # nginx ↔ backend ↔ frontend
    name: eurotrips_external
