# nginx/nginx.prod.conf — PRODUCTION
# SSL termination + reverse proxy
# api.eurotrips.ua    → backend:3000
# booking.eurotrips.ua → frontend:80

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ────────────────────────────────────────────────
  log_format main '$remote_addr - [$time_local] "$request" '
                  '$status $body_bytes_sent '
                  'rt=$request_time ua="$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  client_max_body_size 10m;

  # ── Gzip ───────────────────────────────────────────────────
  gzip              on;
  gzip_comp_level   5;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_types
    text/plain text/css text/javascript text/xml
    application/json application/javascript application/xml
    application/xml+rss image/svg+xml;

  # ── Security headers (глобальні) ───────────────────────────
  add_header X-Frame-Options          "SAMEORIGIN"            always;
  add_header X-Content-Type-Options   "nosniff"               always;
  add_header X-XSS-Protection         "1; mode=block"         always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

  # ── Rate limiting zones ────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
  limit_req_zone $binary_remote_addr zone=docs_zone:10m  rate=30r/m;

  # ── Upstreams ──────────────────────────────────────────────
  upstream backend  {
    server backend:3000;
    keepalive 16;
  }
  upstream frontend {
    server frontend:80;
    keepalive 8;
  }

  # ── HTTP → HTTPS redirect ──────────────────────────────────
  server {
    listen 80;
    server_name api.eurotrips.ua booking.eurotrips.ua;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── API Server (api.eurotrips.ua) ──────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.eurotrips.ua;

    ssl_certificate     /etc/letsencrypt/live/api.eurotrips.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eurotrips.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (2 роки)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Auth endpoints (strict rate-limit: 10/хв) ──────────
    location ~ ^/api/v1/auth/(login|refresh) {
      limit_req zone=auth_zone burst=5 nodelay;
      limit_req_status 429;

      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── REST API ───────────────────────────────────────────
    location /api/ {
      limit_req zone=api_zone burst=30 nodelay;
      limit_req_status 429;

      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Health check (без rate-limit, без логів) ───────────
    location = /api/v1/health {
      proxy_pass http://backend;
      access_log off;
    }

    # ── Swagger (тільки не-production або IP-whitelist) ────
    location /docs {
      # Розкоментувати для обмеження доступу:
      # allow 1.2.3.4;  # IP офісу
      # deny all;

      limit_req zone=docs_zone burst=10;
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # ── 404 для невідомих шляхів ───────────────────────────
    location / {
      return 404 '{"error":"Not Found"}';
      add_header Content-Type application/json;
    }
  }

  # ── Frontend Server (booking.eurotrips.ua) ─────────────────
  server {
    listen 443 ssl http2;
    server_name booking.eurotrips.ua;

    ssl_certificate     /etc/letsencrypt/live/api.eurotrips.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eurotrips.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://api.eurotrips.ua"
      always;

    # ── React SPA ─────────────────────────────────────────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      # Не кешуємо HTML (index.html)
      proxy_set_header   Cache-Control "no-cache";
    }

    # ── Статичні assets (Vite генерує hash → cache 1 рік) ─
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
      proxy_pass         http://frontend;
      proxy_set_header   Host $host;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }
  }
}
