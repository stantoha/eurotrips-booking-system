name: Eurotrips CI/CD

on:
  push:
    branches: [develop, main, staging]
  pull_request:
    branches: [develop, main]

# ── Змінні ──────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint + Type-check + Tests ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eurotrips_test
          POSTGRES_USER: eurotrips
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://eurotrips:test_pass@localhost:5432/eurotrips_test

      - name: Run DB migrations (test)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eurotrips:test_pass@localhost:5432/eurotrips_test

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://eurotrips:test_pass@localhost:5432/eurotrips_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_32_chars_minimum_x
          JWT_REFRESH_SECRET: test_refresh_secret_32_chars_minimum
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 2. Build Docker Image ─────────────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to Staging (develop branch) ────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/eurotrips
            docker pull ${{ needs.build.outputs.image_tag }}
            
            # Запускаємо міграції перед deployment
            docker run --rm \
              --env-file .env.staging \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop \
              npx prisma migrate deploy
            
            # Оновлюємо сервіс
            docker compose -f docker-compose.staging.yml up -d --no-deps api
            
            echo "✅ Staging deployment завершено: $(date)"

  # ── 4. Deploy to Production (main branch) ────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.eurotrips.ua

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/eurotrips
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Бекап БД перед міграцією
            docker exec eurotrips_postgres \
              pg_dump -U $DB_USER $DB_NAME > /backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql
            
            # Запускаємо міграції
            docker run --rm \
              --env-file .env.production \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              npx prisma migrate deploy
            
            # Оновлюємо сервіс (zero-downtime)
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale api=2 api
            sleep 15
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale api=1 api
            
            echo "✅ Production deployment завершено: $(date)"
